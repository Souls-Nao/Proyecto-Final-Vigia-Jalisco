<!DOCTYPE html>
<!--
  index.html (raíz del repositorio)
  Qué hace: manda al visitante al sitio, que vive en la carpeta web/.
  Por qué existe: GitHub Pages publica desde la raíz del repositorio y busca aquí un index.html.
  Cómo se prueba: abrir este archivo en el navegador; debe aparecer web/index.html.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Vigía Jalisco</title>
  <!-- Redirección inmediata (0 segundos) a la página del mapa -->
  <meta http-equiv="refresh" content="0; url=web/index.html">
</head>
<body>
  <!-- Por si el navegador no sigue la redirección, dejamos un enlace a la vista -->
  <p>Abriendo Vigía Jalisco… Si no pasa nada, <a href="web/index.html">entra aquí</a>.</p>
</body>
</html>
